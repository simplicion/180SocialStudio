version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: social-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-social_studio_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/180-social-studio-backend/Dockerfile
    container_name: social-studio-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-social_studio_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-social_studio_secret_production_key}
      TREND_WORKER_URL: http://trend-worker:4010
      TREND_WORKER_SECRET: ${TREND_WORKER_SECRET:?set TREND_WORKER_SECRET}
    ports:
      - '4005:4005'

  # Trend research sidecar. Internal network only: no published port.
  trend-worker:
    build:
      context: services/trend-worker
    container_name: social-studio-trend-worker
    restart: unless-stopped
    environment:
      TREND_WORKER_SECRET: ${TREND_WORKER_SECRET:?set TREND_WORKER_SECRET}
      # Optional official credentials; each unlocks one lane.
      TREND_WORKER_GITHUB_TOKEN: ${TREND_WORKER_GITHUB_TOKEN:-}
      TREND_WORKER_X_BEARER_TOKEN: ${TREND_WORKER_X_BEARER_TOKEN:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      # Free web & news search (no API key): SearXNG below, with the ddgs library as fallback.
      SEARXNG_URL: http://searxng:8080
      # Chromium render fallback for JavaScript-only article pages (the image ships Chromium).
      TREND_WORKER_BROWSER: ${TREND_WORKER_BROWSER:-1}
    depends_on:
      - searxng

  # Open-source metasearch used by trend-worker for keyless web & news search. Internal network only.
  searxng:
    image: searxng/searxng:latest
    container_name: social-studio-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (any long random string)}
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  postgres_data:
