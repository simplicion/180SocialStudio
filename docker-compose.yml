version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: social-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-social_studio_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/180-social-studio-backend/Dockerfile
    container_name: social-studio-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-social_studio_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-social_studio_secret_production_key}
    ports:
      - '4005:4005'

volumes:
  postgres_data:
